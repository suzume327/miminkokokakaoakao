<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3f7d5e">
<title>シコ記録帳</title>
<style>
:root{--host-fg:#233d34;--host-fg-muted:#7e8b83;--host-card:#ffffff;--host-card-fg:#233d34;--host-border:#e5eae1;--host-input:#ffffff;--host-muted:#f1f4ed;--host-primary:#3f7d5e;--host-secondary:#eef2ea;--host-secondary-fg:#3b5c49;--host-error:#c0574a;}
@media (prefers-color-scheme: dark){:root{--host-fg:#e7ece8;--host-fg-muted:#98a59d;--host-card:#1b211d;--host-card-fg:#e7ece8;--host-border:#2b332d;--host-input:#20261f;--host-muted:#242b26;--host-primary:#4f9d75;--host-secondary:#242b26;--host-secondary-fg:#dfe6e0;--host-error:#e08a7e;}}
*{box-sizing:border-box}
body{margin:0;background:#f6f7f3;color:var(--host-fg);font-family:'Inter',system-ui,-apple-system,'Noto Sans JP',sans-serif;}
@media (prefers-color-scheme: dark){body{background:#12160f;}}
#sk{--g:#3f7d5e;--gacc:#4f9d75;--gsoft:rgba(63,125,94,.13);color:var(--host-fg);max-width:760px;margin:0 auto;display:flex;align-items:flex-start;gap:0;min-height:100vh;}
#sk *{box-sizing:border-box}
#sk .side{width:180px;flex:0 0 180px;padding:16px 12px;border-right:1px solid var(--host-border);align-self:stretch;position:sticky;top:0;}
#sk .brand{display:flex;align-items:center;gap:8px;font-weight:500;font-size:15px;margin-bottom:16px;padding:0 4px;}
#sk .brand .dot{width:26px;height:26px;border-radius:8px;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto;}
#sk .nav{display:flex;flex-direction:column;gap:2px;}
#sk .nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:9px 10px;font-size:12.5px;color:var(--host-fg-muted);cursor:pointer;font-family:inherit;}
#sk .nav button:hover{background:var(--host-muted);}
#sk .nav button.on{background:var(--gsoft);color:var(--gacc);font-weight:500;}
#sk .side .streakbox{margin-top:16px;padding:10px 11px;border:1px solid var(--host-border);border-radius:10px;background:var(--host-card);}
#sk .side .streakbox b{font-size:20px;color:var(--gacc);font-weight:500;}
#sk .side .streakbox div{font-size:10px;color:var(--host-fg-muted);line-height:1.5;}
#sk .main{flex:1;min-width:0;padding:16px 6px 26px 18px;}
#sk .card{background:var(--host-card);border:1px solid var(--host-border);border-radius:12px;padding:14px;margin-bottom:14px;}
#sk h2{font-size:13px;font-weight:500;margin:0 0 10px;}
#sk .muted{color:var(--host-fg-muted);font-size:11px;}
#sk .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
#sk .stat{background:var(--host-card);border:1px solid var(--host-border);border-radius:10px;padding:10px 8px;text-align:center;}
#sk .stat .k{font-size:10px;color:var(--host-fg-muted);margin-bottom:4px;}
#sk .stat .v{font-size:19px;font-weight:500;}
#sk .stat .v span{font-size:10px;color:var(--host-fg-muted);margin-left:2px;}
#sk input,#sk select{background:var(--host-input);color:var(--host-fg);border:1px solid var(--host-border);border-radius:8px;padding:8px;font-size:14px;outline:none;font-family:inherit;}
#sk button.b{border:none;border-radius:9px;padding:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;}
#sk .b.pri{background:var(--g);color:#fff;}
#sk .b.sec{background:var(--host-secondary);color:var(--host-secondary-fg);border:1px solid var(--host-border);}
#sk .b.mut{background:var(--host-muted);color:var(--host-fg);border:1px solid var(--host-border);}
#sk .b.dang{background:transparent;color:var(--host-error);border:1px solid var(--host-border);}
#sk .chip{background:var(--host-muted);color:var(--host-fg);border:1px solid var(--host-border);border-radius:20px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit;}
#sk .chip.tag{color:var(--gacc);}
#sk .bar-wrap{display:flex;align-items:flex-end;gap:8px;height:120px;padding:0 2px;}
#sk .bar-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;}
#sk .bar{width:60%;max-width:26px;background:#cfe0d4;border-radius:5px 5px 2px 2px;min-height:3px;position:relative;}
#sk .bar.today{background:var(--g);}
#sk .bar .n{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--host-fg-muted);}
#sk .bar-day{font-size:10px;color:var(--host-fg-muted);margin-top:6px;}
#sk .bar-day.today{color:var(--gacc);font-weight:500;}
#sk .rank-row{margin-bottom:12px;}
#sk .rank-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}
#sk .rank-track{height:8px;background:var(--host-muted);border-radius:5px;overflow:hidden;}
#sk .rank-fill{height:100%;background:var(--gacc);border-radius:5px;}
#sk .rec{display:flex;align-items:center;gap:10px;border:1px solid var(--host-border);border-radius:10px;padding:9px 11px;margin-bottom:6px;background:var(--host-card);}
#sk .av{border-radius:50%;overflow:hidden;background:var(--host-muted);flex:0 0 auto;position:relative;display:flex;align-items:center;justify-content:center;}
#sk .av img{width:100%;height:100%;object-fit:cover;object-position:50% 8%;position:relative;z-index:1;}
#sk .av .ph{position:absolute;color:#fff;font-weight:500;}
#sk .tag{font-size:11px;border-radius:6px;padding:1px 6px;margin-left:4px;}
#sk .result{display:flex;gap:14px;border:1px solid var(--host-border);border-radius:12px;padding:14px;margin-bottom:14px;background:var(--host-card);}
#sk .result .rt{width:94px;height:120px;border-radius:10px;overflow:hidden;flex:0 0 auto;background:var(--host-muted);position:relative;display:flex;align-items:center;justify-content:center;}
#sk .result .rt img{width:100%;height:100%;object-fit:cover;object-position:50% 8%;position:relative;z-index:1;}
#sk .special{margin-top:8px;padding:8px 10px;border-radius:9px;background:var(--gsoft);font-size:13px;line-height:1.5;display:flex;gap:8px;align-items:flex-start;}
#sk .special .sav{width:26px;height:26px;border-radius:50%;overflow:hidden;flex:0 0 auto;position:relative;display:flex;align-items:center;justify-content:center;}
#sk .special .sav img{width:100%;height:100%;object-fit:cover;object-position:50% 8%;}
#sk .special b{color:var(--gacc);font-size:11px;display:block;margin-bottom:2px;font-weight:500;}
#sk .row{display:flex;gap:8px;}
#sk .view{display:none;} #sk .view.on{display:block;}
#sk .heat{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;}
#sk .heat .cell{aspect-ratio:1;border-radius:4px;background:var(--host-muted);display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--host-fg-muted);}
#sk .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
#sk .cal .cd{aspect-ratio:1;border-radius:6px;background:var(--host-muted);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--host-fg-muted);}
#sk .cal .cd.has{background:var(--gacc);color:#fff;font-weight:500;}
#sk .cal .cd.today{outline:2px solid var(--g);}
#sk .cal .hd{font-size:10px;text-align:center;color:var(--host-fg-muted);}
@media(max-width:620px){
  #sk{flex-direction:column;}
  #sk .side{width:100%;flex:0 0 auto;border-right:0;border-bottom:1px solid var(--host-border);padding:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:static;}
  #sk .brand{margin:0 auto 0 0;}
  #sk .nav{flex-direction:row;flex-wrap:wrap;gap:4px;}
  #sk .nav button{padding:7px 10px;font-size:12px;}
  #sk .side .streakbox{margin:0;width:100%;}
  #sk .main{padding:14px 12px 26px;}
  #sk .stats{grid-template-columns:repeat(2,1fr);}
  #sk .result{flex-direction:column;align-items:center;text-align:center;}
  #sk .result .rt{width:120px;height:150px;}
  #sk .heat{grid-template-columns:repeat(8,1fr);}
}
</style>
</head>

    d.appendChild(ph); d.appendChild(img); return d; }
  var logs=load(), view='dash', resultHTML='';
  function streak(){ var set={}; logs.forEach(function(l){ set[l.day]=true; }); var d=new Date(), s=0; if(!set[dk(d)]) d.setDate(d.getDate()-1); while(set[dk(d)]){ s++; d.setDate(d.getDate()-1); } return s; }
  function renderNav(){ var items=[['dash','ダッシュボード'],['records','記録一覧'],['trends','振り返り'],['settings','設定']];
    document.getElementById('nav').innerHTML=items.map(function(it){ return '<button data-act="nav" data-v="'+it[0]+'" class="'+(view===it[0]?'on':'')+'">'+it[1]+'</button>'; }).join('');
    var s=streak(); document.getElementById('streakBox').innerHTML='<b>'+s+'<span style="font-size:11px;color:var(--host-fg-muted)">日</span></b><div>連続記録中'+(s>0?' 🔥':'')+'<br>今日も抜こう</div>'; }
  function statBox(k,v,u,col){ return '<div class="stat"><div class="k">'+k+'</div><div class="v" style="color:'+(col||'var(--host-fg)')+'">'+v+'<span>'+u+'</span></div></div>'; }
  function renderDash(){
    var t=today(), todayL=logs.filter(function(l){return l.day===t;}), total=logs.length, a=avg(logs), fastest= total? Math.min.apply(null,logs.map(function(l){return l.min;})) : 0;
    var html='<div class="stats">'+statBox('今日の回数',todayL.length,'回','var(--gacc)')+statBox('連続',streak(),'日','#e05a7a')+statBox('平均タイム',a?a.toFixed(1):'-','分')+statBox('最速',fastest?fastest:'-','分','#e05a7a')+'</div>';
    html+='<div class="card"><h2>ストップウォッチ</h2><div id="swDisplay" style="font-size:36px;text-align:center;font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace;">00:00.0</div><div class="row" style="margin-top:10px;"><button class="b pri" id="swStart" style="flex:1">スタート</button><button class="b sec" id="swReset" style="flex:1">リセット</button><button class="b mut" id="swLog" style="flex:1">このタイムで記録</button></div></div>';
    html+='<div class="card"><h2>手入力でも記録</h2><div class="row" style="margin-bottom:10px;"><input id="minInput" type="number" min="0" step="0.1" placeholder="分" style="width:90px"><input id="okazuInput" type="text" placeholder="おかず（例：#花火 #ロリ巨乳）" style="flex:1;min-width:0"></div><div id="chips" style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;"></div><button class="b pri" id="logBtn" style="width:100%">記録する</button></div>';
    html+='<div id="resultBox">'+resultHTML+'</div>';
    html+='<div class="card"><h2>1週間のリズム</h2>'+weekChart()+'</div>';
    html+='<div class="card"><h2>最近の記録</h2><div id="recentBox"></div></div>';
    document.getElementById('v-dash').innerHTML=html;
    var chips=document.getElementById('chips');
    CHIP_TAGS.forEach(function(p){ var b=document.createElement('button'); b.className='chip tag'; b.textContent=p; b.onclick=function(){ var i=document.getElementById('okazuInput'); i.value=(i.value?i.value+' ':'')+p; i.focus(); }; chips.appendChild(b); });
    document.getElementById('logBtn').onclick=function(){ doLog(parseFloat(document.getElementById('minInput').value)); };
    var rb=document.getElementById('recentBox'), rec=logs.slice().reverse().slice(0,3);
    if(!rec.length){ rb.innerHTML='<div class="muted">まだ記録がないよ。一回抜いてこよう。</div>'; } else rec.forEach(function(l){ rb.appendChild(recRow(l)); });
    setupTimer();
  }
  function weekChart(){ var days=[]; for(var i=6;i>=0;i--){ days.push(shift(-i)); } var counts=days.map(function(d){ return logs.filter(function(l){return l.day===d;}).length; }); var max=Math.max(3,Math.max.apply(null,counts));
    return '<div class="bar-wrap">'+days.map(function(d,i){ var dt=new Date(d+'T12:00:00'), isT=d===today(), h=counts[i]/max*100;
      return '<div class="bar-col"><div class="bar'+(isT?' today':'')+'" style="height:'+h+'%">'+(counts[i]?'<span class="n">'+counts[i]+'</span>':'')+'</div><div class="bar-day'+(isT?' today':'')+'">'+DAYN[dt.getDay()]+'</div></div>'; }).join('')+'</div>'; }
  function recRow(l){ var r=tier(l.min), g=GIRLS[l.girl || pick(r.picks).girl];
    var row=document.createElement('div'); row.className='rec'; row.appendChild(avatar(g,34));
    var mid=document.createElement('div'); mid.style.cssText='flex:1;min-width:0;';
    mid.innerHTML='<div style="font-size:13px"><b>'+l.min+'分</b><span class="tag" style="color:'+r.col+';border:1px solid '+r.col+'">'+r.label+'</span></div><div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(esc(l.okazu)||'おかず不明')+'</div>';
    row.appendChild(mid);
    var right=document.createElement('div'); right.style.cssText='text-align:right;flex:0 0 auto;';
    right.innerHTML='<div class="muted">'+fmtTime(l.ts)+'</div><span data-act="del" data-ts="'+l.ts+'" style="cursor:pointer;color:var(--host-error);font-size:11px">削除</span>';
    row.appendChild(right); return row; }
  function renderRecords(){
    document.getElementById('v-records').innerHTML='<div class="card"><div class="row" style="margin-bottom:10px;"><input id="searchInput" type="text" placeholder="おかずで検索" style="flex:1"></div><div id="allList"></div></div>';
    var input=document.getElementById('searchInput');
    function paint(){ var q=input.value.trim().toLowerCase(); var list=logs.slice().reverse().filter(function(l){ return !q || (l.okazu||'').toLowerCase().indexOf(q)>=0; }); var box=document.getElementById('allList');
      if(!list.length){ box.innerHTML='<div class="muted">該当なし</div>'; return; } box.innerHTML=''; list.forEach(function(l){ box.appendChild(recRow(l)); }); }
    input.oninput=paint; paint(); }
  function heatmap(){
    var hrs=new Array(24).fill(0); logs.forEach(function(l){ hrs[new Date(l.ts).getHours()]++; });
    var max=Math.max(1,Math.max.apply(null,hrs));
    var cells=''; for(var h=0;h<24;h++){ var o=hrs[h]?0.25+0.75*hrs[h]/max:0; var bg=hrs[h]?'rgba(79,157,117,'+o+')':'var(--host-muted)'; var col=hrs[h]&&o>0.5?'#fff':'var(--host-fg-muted)';
      cells+='<div class="cell" style="background:'+bg+';color:'+col+'" title="'+h+'時 '+hrs[h]+'回">'+h+'</div>'; }
    return '<div class="heat">'+cells+'</div><div class="muted" style="margin-top:8px">色が濃い時間ほどよくやってるよ（0〜23時）</div>'; }
  function calendar(){
    var now=new Date(), y=now.getFullYear(), mo=now.getMonth();
    var first=new Date(y,mo,1).getDay(), days=new Date(y,mo+1,0).getDate();
    var set={}; logs.forEach(function(l){ set[l.day]=(set[l.day]||0)+1; });
    var html='<div class="cal">'+DAYN.map(function(d){return '<div class="hd">'+d+'</div>';}).join('');
    for(var i=0;i<first;i++) html+='<div></div>';
    for(var d=1;d<=days;d++){ var key=dk(new Date(y,mo,d)); var has=set[key]; var cls='cd'+(has?' has':'')+(key===today()?' today':'');
      html+='<div class="'+cls+'" title="'+key+' '+(has||0)+'回">'+d+'</div>'; }
    html+='</div>';
    return '<div style="font-size:11px;margin-bottom:8px;color:var(--host-fg-muted)">'+y+'年'+(mo+1)+'月</div>'+html; }
  function renderTrends(){
    var total=logs.length, map={}; logs.forEach(function(l){ var k=(l.okazu||'未入力'); map[k]=(map[k]||0)+1; });
    var arr=Object.keys(map).map(function(k){return {k:k,c:map[k]};}).sort(function(a,b){return b.c-a.c;}).slice(0,8), maxc=arr.length?arr[0].c:1;
    var rankHTML=arr.length?arr.map(function(r){ return '<div class="rank-row"><div class="rank-head"><span>'+esc(r.k)+'</span><span class="muted">'+r.c+'回</span></div><div class="rank-track"><div class="rank-fill" style="width:'+(r.c/maxc*100)+'%"></div></div></div>'; }).join(''):'<div class="muted">まだデータがないよ</div>';
    var keys={}; TIERS.forEach(function(t){keys[t.label]=0;}); logs.forEach(function(l){ keys[tier(l.min).label]++; });
    var rmax=Math.max(1,Math.max.apply(null,Object.keys(keys).map(function(k){return keys[k];})));
    var rateHTML=Object.keys(keys).map(function(k){ return '<div class="rank-row"><div class="rank-head"><span>'+k+'</span><span class="muted">'+keys[k]+'回</span></div><div class="rank-track"><div class="rank-fill" style="width:'+(keys[k]/rmax*100)+'%"></div></div></div>'; }).join('');
    document.getElementById('v-trends').innerHTML='<div class="stats">'+statBox('合計',total,'回')+statBox('平均',total?avg(logs).toFixed(1):'-','分')+statBox('最速',total?Math.min.apply(null,logs.map(function(l){return l.min;})):'-','分')+statBox('連続',streak(),'日','var(--gacc)')+'</div>'
      +'<div class="card"><h2>時間帯ヒートマップ</h2>'+heatmap()+'</div>'
      +'<div class="card"><h2>今月のカレンダー</h2>'+calendar()+'</div>'
      +'<div class="card"><h2>おかずランキング</h2>'+rankHTML+'</div>'
      +'<div class="card"><h2>評価の内訳</h2>'+rateHTML+'</div>'; }
  function renderSettings(){
    var guide=TIERS.map(function(t,i){ var lo=i===0?'0分':TIERS[i-1].max+'分'; var hi=t.max===Infinity?'〜':t.max+'分'; return [t.label,lo+'〜'+hi]; });
    document.getElementById('v-settings').innerHTML='<div class="card"><h2>評価の目安</h2>'+guide.map(function(g){ return '<div class="rank-head" style="margin:6px 0"><span>'+g[0]+'</span><span class="muted">'+g[1]+'</span></div>'; }).join('')+'</div>'
      +'<div class="card"><h2>バックアップ</h2><div class="muted" style="margin-bottom:10px">記録はこのブラウザに保存。JSONで書き出し・読み込みできるよ。</div><div class="row" style="flex-wrap:wrap"><button class="b sec" data-act="exp-json">JSON書き出し</button><button class="b sec" data-act="exp-csv">CSV書き出し</button><button class="b sec" data-act="imp-json">バックアップ読み込み</button></div><input type="file" id="impFile" accept=".json" hidden></div>'
      +'<div class="card"><h2>データ削除</h2><div class="muted" style="margin-bottom:10px">保存済みの記録を全部消すよ。</div><button class="b dang" data-act="clear">すべて削除</button></div>'; }
  function doLog(m){
    if(isNaN(m)||m<0) return;
    var okazu=document.getElementById('okazuInput').value.trim();
    var entry={min:Math.round(m*10)/10, okazu:okazu, ts:Date.now(), day:today()};
    logs.push(entry); save();
    var r=tier(entry.min); var pk=pick(r.picks); var g=GIRLS[pk.girl]; entry.girl=pk.girl;
    var sp=specialsFor(okazu);
    var spHTML=sp.map(function(gk){ var sg=GIRLS[gk]; return '<div class="special"><div class="sav" style="background:'+sg.c+'"><img src="'+sg.img+'" onerror="this.style.display=\'none\'"></div><div><b>'+sg.name+' の特別セリフ</b>'+pick(SLINES[gk])+'</div></div>'; }).join('');
    resultHTML='<div class="result" style="border-left:3px solid '+g.c+'">'+bigImg(g).outerHTML+'<div style="flex:1"><div class="muted" style="margin-bottom:3px">'+g.name+'</div><div style="font-size:15px;font-weight:500;line-height:1.5">'+pick(pk.lines)+'</div><div class="muted" style="margin-top:8px">今回 '+entry.min+'分 → 評価【'+r.label+'】'+(entry.okazu?' ／ '+esc(entry.okazu):'')+'</div>'+spHTML+'</div></div>';
    render();
    var mi=document.getElementById('minInput'); if(mi) mi.value=''; var oi=document.getElementById('okazuInput'); if(oi) oi.value=''; }
  var sw={running:false,start:0,acc:0,timer:null};
  function swfmt(ms){ var t=ms/1000, m=Math.floor(t/60), s=Math.floor(t%60), d=Math.floor((ms%1000)/100); return ('0'+m).slice(-2)+':'+('0'+s).slice(-2)+'.'+d; }
  function setupTimer(){ var disp=document.getElementById('swDisplay');
    function tick(){ if(disp) disp.textContent=swfmt(sw.acc+(sw.running?Date.now()-sw.start:0)); }
    document.getElementById('swStart').onclick=function(){ if(sw.running){ sw.acc+=Date.now()-sw.start; sw.running=false; clearInterval(sw.timer); this.textContent='スタート'; } else { sw.running=true; sw.start=Date.now(); this.textContent='ストップ'; sw.timer=setInterval(tick,100); } tick(); };
    document.getElementById('swReset').onclick=function(){ sw.running=false; clearInterval(sw.timer); sw.acc=0; sw.start=0; document.getElementById('swStart').textContent='スタート'; tick(); };
    document.getElementById('swLog').onclick=function(){ var ms=sw.acc+(sw.running?Date.now()-sw.start:0); if(ms<=0) return; sw.running=false; clearInterval(sw.timer); document.getElementById('swStart').textContent='スタート'; doLog(ms/60000); sw.acc=0; sw.start=0; tick(); };
    tick(); }
  function render(){ document.querySelectorAll('#sk .view').forEach(function(v){ v.classList.toggle('on', v.id==='v-'+view); }); renderNav();
    if(view==='dash') renderDash(); if(view==='records') renderRecords(); if(view==='trends') renderTrends(); if(view==='settings') renderSettings(); }
  document.getElementById('sk').addEventListener('click',function(e){ var b=e.target.closest('[data-act]'); if(!b) return; var act=b.getAttribute('data-act');
    if(act==='nav'){ view=b.getAttribute('data-v'); resultHTML=''; render(); }
    if(act==='del'){ var ts=parseInt(b.getAttribute('data-ts'),10); logs=logs.filter(function(l){return l.ts!==ts;}); save(); render(); }
    if(act==='exp-json'){ dl(JSON.stringify({app:'shiko',version:1,logs:logs},null,2),'shiko_backup.json','application/json'); }
    if(act==='exp-csv'){ dl(csv(),'shiko.csv','text/csv'); }
    if(act==='imp-json'){ document.getElementById('impFile').click(); }
    if(act==='clear'){ if(confirm('全部削除する？')){ logs=[]; save(); render(); } } });
  document.getElementById('sk').addEventListener('change',function(e){ if(e.target.id==='impFile'){ var f=e.target.files[0]; if(!f) return; var rd=new FileReader();
    rd.onload=function(){ try{ var data=JSON.parse(rd.result), inc=(data.logs||data.records||data); if(!Array.isArray(inc)) throw 0;
      var seen={}; logs.forEach(function(l){ seen[l.ts]=true; }); var added=0;
      inc.forEach(function(l){ if(l&&typeof l.min==='number'&&l.ts&&!seen[l.ts]){ logs.push({min:l.min,okazu:l.okazu||'',ts:l.ts,day:l.day||dk(new Date(l.ts)),girl:l.girl}); seen[l.ts]=true; added++; } });
      save(); render(); alert(added+'件読み込んだよ'); }catch(err){ alert('読み込めなかった'); } }; rd.readAsText(f); } });
  function dl(content,name,type){ var blob=new Blob([content],{type:type}); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); }
  function csv(){ var head='日時,分数,おかず,評価\n'; return head+logs.map(function(l){ var r=tier(l.min); return '"'+fmtTime(l.ts)+'",'+l.min+',"'+String(l.okazu).replace(/"/g,'""')+'","'+r.label+'"'; }).join('\n'); }
  render();
})();
</script>
